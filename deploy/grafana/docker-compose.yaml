name: aiopslab-observability

services:
  grafana:
    image: grafana/grafana:13.2.2
    container_name: aiopslab-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/grafana/.env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_SYNC: "grafana-opensearch-datasource@2.34.6"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      AIOPSLAB_APP_PROMETHEUS_URL: "${AIOPSLAB_APP_PROMETHEUS_URL}"
      AIOPSLAB_INFRA_PROMETHEUS_URL: "${AIOPSLAB_INFRA_PROMETHEUS_URL}"
      AIOPSLAB_OPENSEARCH_URL: "${AIOPSLAB_OPENSEARCH_URL}"
      AIOPSLAB_JAEGER_URL: "${AIOPSLAB_JAEGER_URL}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  grafana-data:
    name: aiopslab-grafana-data
