apiVersion: 1

prune: true

datasources:
  - name: Astronomy Shop metrics
    uid: webstore-metrics
    type: prometheus
    access: proxy
    url: $AIOPSLAB_APP_PROMETHEUS_URL
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - datasourceUid: webstore-traces
          name: trace_id

  - name: AIOpsLab infrastructure metrics
    uid: aiopslab-infra-metrics
    type: prometheus
    access: proxy
    url: $AIOPSLAB_INFRA_PROMETHEUS_URL
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Astronomy Shop logs
    uid: webstore-logs
    type: grafana-opensearch-datasource
    access: proxy
    url: $AIOPSLAB_OPENSEARCH_URL
    editable: false
    jsonData:
      database: otel-logs-*
      flavor: opensearch
      version: 3.8.0
      timeField: "@timestamp"
      logMessageField: body
      logLevelField: severityText
      pplEnabled: true
      serverless: false
      maxConcurrentShardRequests: 5
      timeInterval: 10s

  - name: Astronomy Shop traces
    uid: webstore-traces
    type: jaeger
    access: proxy
    url: $AIOPSLAB_JAEGER_URL
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: webstore-logs
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: true
        filterBySpanID: true
        customQuery: true
        query: 'traceId:"$${__trace.traceId}" AND spanId:"$${__span.spanId}"'
