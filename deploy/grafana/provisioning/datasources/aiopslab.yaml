apiVersion: 1

prune: true

datasources:
  - name: Astronomy Shop metrics
    uid: webstore-metrics
    type: prometheus
    access: proxy
    url: $AIOPSLAB_APP_PROMETHEUS_URL
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - datasourceUid: webstore-traces
          name: trace_id

  - name: AIOpsLab infrastructure metrics
    uid: aiopslab-infra-metrics
    type: prometheus
    access: proxy
    url: $AIOPSLAB_INFRA_PROMETHEUS_URL
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Astronomy Shop logs
    uid: webstore-logs
    type: grafana-opensearch-datasource
    access: proxy
    url: $AIOPSLAB_OPENSEARCH_URL
    editable: false
    jsonData:
      database: otel-logs-*
      flavor: opensearch
      version: 3.8.0
      timeField: "@timestamp"
      logMessageField: body
      logLevelField: severityText
      pplEnabled: true
      serverless: false
      maxConcurrentShardRequests: 5
      timeInterval: 10s

  - name: Astronomy Shop traces
    uid: webstore-traces
    type: jaeger
    access: proxy
    url: $AIOPSLAB_JAEGER_URL
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: webstore-logs
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: true
        filterBySpanID: true
        customQuery: true
        query: 'traceId:"$${__trace.traceId}" AND spanId:"$${__span.spanId}"'

  - name: AIOpsLab multimodal features
    uid: aiopslab-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    jsonData:
      host: $AIOPSLAB_CLICKHOUSE_HOST
      port: 8123
      protocol: http
      username: $AIOPSLAB_CLICKHOUSE_USER
      defaultDatabase: aiopslab
      defaultTable: gold_multimodal_latest
      # The ClickHouse plugin expects duration settings as strings. YAML
      # numbers are decoded as float64 and make plugin 4.8.x fail health checks.
      dialTimeout: "10"
      queryTimeout: "60"
    secureJsonData:
      password: $AIOPSLAB_CLICKHOUSE_PASSWORD
