kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.32.1
    # etcd requires low-latency fsync. Keep its ephemeral state away from the
    # same disk used by Flink, Kafka, ClickHouse, and the workload containers.
    extraMounts:
      - hostPath: /dev/shm/aiopslab-kind-etcd
        containerPath: /var/lib/etcd
  - role: worker
    image: kindest/node:v1.32.1
# Keep host /run/udev isolated from privileged Kind nodes.
